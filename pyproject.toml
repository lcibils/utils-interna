[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utils-interna"
version = "1.0.0"
description = "Utilidades internas del equipo"
requires-python = ">=3.9"
dependencies = [
    "ldap3>=2.9",
    "pycryptodome>=3.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src/utils_interna"]